name: Validate Marketplace PR

on:
  pull_request:
    paths:
      - "registry/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Marketplace proposal
        uses: actions/checkout@v6
        with:
          path: marketplace

      - name: Checkout Codmes validator
        uses: actions/checkout@v6
        with:
          repository: "${{ github.repository_owner }}/Codmes"
          ref: 8a0db5d823f85e4a748dcfb35383d93c11dac1ec
          path: codmes

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install validator dependencies
        working-directory: codmes
        run: npm install --ignore-scripts

      - name: Verify Registry, package checksums, and Publisher signatures
        run: |
          node codmes/bin/codmes.mjs plugin registry validate \
            --registry marketplace/registry/index.json \
            --production \
            --verify-assets
