name: Validate Marketplace PR

on:
  pull_request:
    paths:
      - "registry/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CODMES_DISTRIBUTION_CLI_VERSION: "1.0.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Marketplace proposal
        uses: actions/checkout@v6
        with:
          path: marketplace

      - name: Checkout Codmes validator
        uses: actions/checkout@v6
        with:
          repository: "${{ github.repository_owner }}/Codmes"
          ref: codmes-distribution-cli-v${{ env.CODMES_DISTRIBUTION_CLI_VERSION }}
          path: codmes

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install validator dependencies
        working-directory: codmes
        run: npm install --ignore-scripts

      - name: Verify Distribution CLI version
        working-directory: codmes
        run: |
          actual="$(node bin/codmes.mjs plugin distribution version)"
          expected="Codmes Distribution CLI $CODMES_DISTRIBUTION_CLI_VERSION (codmes-distribution-cli-v$CODMES_DISTRIBUTION_CLI_VERSION)"
          test "$actual" = "$expected"

      - name: Verify Registry, package checksums, and Publisher signatures
        run: |
          node codmes/bin/codmes.mjs plugin registry validate \
            --registry marketplace/registry/index.json \
            --production \
            --verify-assets
